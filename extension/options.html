<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Eu Passo — seletores por domínio</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0; padding: 28px 20px 60px; background: #f6f8f8; color: #10312f;
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .wrap { max-width: 760px; margin: 0 auto; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      p.sub { margin: 0 0 20px; font-size: 13px; color: #5b716f; line-height: 1.5; }
      .card {
        background: #fff; border: 1px solid #e2eae9; border-radius: 12px;
        padding: 16px; margin-bottom: 14px;
      }
      .row { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
      label { display: block; font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
        color: #7a8f8d; margin: 12px 0 4px; }
      input[type="text"], textarea {
        width: 100%; box-sizing: border-box; padding: 8px 10px; font-size: 12px;
        border: 1px solid #cfdad9; border-radius: 8px; background: #fff;
        font-family: ui-monospace, monospace;
      }
      textarea { min-height: 58px; resize: vertical; }
      button {
        padding: 8px 14px; border: 0; border-radius: 8px; background: #14706a; color: #fff;
        font-size: 13px; font-weight: 600; cursor: pointer;
      }
      button.sec { background: #fff; color: #14706a; border: 1px solid #cfdad9; }
      button.del { background: #fff; color: #a33; border: 1px solid #edd; }
      .barra { display: flex; gap: 10px; margin-top: 18px; }
      .aviso { font-size: 12px; color: #14706a; margin-top: 10px; min-height: 16px; }
      .hint { font-size: 11px; color: #7a8f8d; margin-top: 4px; }
      .vazio { font-size: 13px; color: #5b716f; }
      .top { display: flex; gap: 8px; align-items: center; }
      .top input[type="text"] { flex: 1; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Seletores por domínio</h1>
      <p class="sub">
        Adicione regras para sites de vagas específicos. Cada campo aceita vários seletores CSS,
        um por linha (ou separados por vírgula). Suas regras têm prioridade sobre as embutidas —
        os seletores padrão continuam valendo como reserva.
      </p>

      <div id="lista"></div>

      <div class="barra">
        <button id="novo">Adicionar domínio</button>
        <button class="sec" id="salvar">Salvar</button>
        <button class="sec" id="exportar">Exportar JSON</button>
        <button class="sec" id="importar">Importar JSON</button>
      </div>
      <div class="aviso" id="aviso"></div>
      <input type="file" id="arquivo" accept="application/json" style="display:none" />
    </div>
    <script src="options.js"></script>
  </body>
</html>
